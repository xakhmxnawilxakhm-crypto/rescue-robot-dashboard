<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าจอควบคุมและติดตามหุ่นยนต์กู้ภัย</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 520px;
      padding: 30px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    .subtitle {
      color: #666;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    .camera-box {
      background: #111;
      border-radius: 12px;
      height: 280px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .camera-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-placeholder {
      color: #aaa;
      font-size: 0.9rem;
    }
    .status-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.2s;
    }
    .status-normal { background: #22c55e; }
    .status-alert { background: #f59e0b; }
    .status-emergency { background: #ef4444; }

    .victim-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .victim-box h3 {
      font-size: 1rem;
      margin-bottom: 8px;
      color: #334155;
    }
    .victim-count {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0f172a;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
    }
    .controls button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: #e2e8f0;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .controls button:hover {
      background: #cbd5e1;
    }
    .url-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    .small-text {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 10px;
    }
    .start-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      margin-bottom: 16px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .start-btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚨 หน้าจอควบคุมและติดตามหุ่นยนต์กู้ภัย</h1>
    <p class="subtitle">ภาพสตรีมสดจากกล้องหุ่นยนต์</p>

    <!-- ช่องใส่ลิงก์กล้อง -->
    <input type="text" id="cameraUrl" class="url-input" 
           placeholder="วางลิงก์จาก IP Webcam เช่น http://192.168.1.10:8080/video">
    <button class="start-btn" onclick="startCamera()">เริ่มแสดงภาพสด</button>

    <!-- กล่องแสดงภาพ -->
    <div class="camera-box" id="cameraBox">
      <div class="camera-placeholder">รอเชื่อมต่อกล้อง...</div>
    </div>

    <!-- สถานะ -->
    <button class="status-btn status-normal" id="statusBtn" onclick="changeStatus()">
      สถานะ: กำลังลาดตระเวน (ปกติ)
    </button>

    <!-- ส่วนนับผู้ประสบภัย -->
    <div class="victim-box">
      <h3>จำนวนผู้ประสบภัยที่ตรวจพบ</h3>
      <div class="victim-count" id="victimCount">0</div>
      <div class="controls">
        <button onclick="changeVictim(-1)">−</button>
        <button onclick="changeVictim(1)">+</button>
        <button onclick="resetVictim()">รีเซ็ต</button>
      </div>
    </div>

    <p class="small-text">
      * ใช้มือถือ Android + แอป IP Webcam<br>
      * กด + หรือ − เพื่อบันทึกจำนวนคนที่พบ<br>
      * กดปุ่มสถานะเพื่อเปลี่ยนสถานะหุ่นยนต์
    </p>
  </div>

  <script>
    let currentStatus = 0; // 0=ปกติ, 1=พบคน, 2=ฉุกเฉิน
    let victim = 0;

    const statusList = [
      { text: "สถานะ: กำลังลาดตระเวน (ปกติ)", class: "status-normal" },
      { text: "สถานะ: พบผู้ประสบภัย", class: "status-alert" },
      { text: "สถานะ: ขอความช่วยเหลือเร่งด่วน!", class: "status-emergency" }
    ];

    function startCamera() {
      const url = document.getElementById("cameraUrl").value.trim();
      const box = document.getElementById("cameraBox");

      if (!url) {
        alert("กรุณาวางลิงก์จาก IP Webcam ก่อน");
        return;
      }

      box.innerHTML = `<img src="${url}" alt="Live Camera" onerror="this.parentElement.innerHTML='<div class=\\'camera-placeholder\\'>ไม่สามารถโหลดภาพได้<br>ตรวจสอบลิงก์และ Wi-Fi</div>'">`;
    }

    function changeStatus() {
      currentStatus = (currentStatus + 1) % 3;
      const btn = document.getElementById("statusBtn");
      btn.textContent = statusList[currentStatus].text;
      btn.className = "status-btn " + statusList[currentStatus].class;
    }

    function changeVictim(num) {
      victim = Math.max(0, victim + num);
      document.getElementById("victimCount").textContent = victim;

      // ถ้ามีคนและสถานะยังปกติ → เปลี่ยนเป็นพบผู้ประสบภัย
      if (victim > 0 && currentStatus === 0) {
        currentStatus = 1;
        const btn = document.getElementById("statusBtn");
        btn.textContent = statusList[1].text;
        btn.className = "status-btn " + statusList[1].class;
      }
    }

    function resetVictim() {
      victim = 0;
      document.getElementById("victimCount").textContent = 0;
    }
  </script>
</body>
</html>
